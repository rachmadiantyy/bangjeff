apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bangjeff-ingress
  namespace: bangjeff-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Accept, Accept-Version, Content-Length, Content-MD5, Content-Type, Date, Authorization, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-expose-headers: "X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - host: dev-api.bangjeff.com
    http:
      paths:
        # AUTH SERVICE
        - path: /auth/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: auth-service
              port:
                number: 80

        # ADMIN SERVICE
        - path: /admin/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: admin-service
              port:
                number: 80

        # USER SERVICE
        - path: /user/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: user-service
              port:
                number: 80

        # RESELLER SERVICE
        - path: /reseller/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: reseller-service
              port:
                number: 80

        # CATALOG SERVICE
        - path: /catalog/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: catalog-service
              port:
                number: 80

        # SUPPLIER SERVICE
        - path: /supplier/(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: supplier-service
              port:
                number: 80
